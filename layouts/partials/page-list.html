<section class="mt-4">
  <ul class="archive-list">
    {{ range . }}
      <li class="contents">
        <time
          datetime="{{ .Date.Format "2006-01-02" }}"
        >
          {{ .Date.Format "Jan 2 2006" }}
        </time>

        <a href="{{ .RelPermalink }}">{{ .Title }}</a>
      </li>
    {{ end }}
  </ul>
</section>

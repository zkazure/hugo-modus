{{ $showToc := true }}
{{ if isset .Site.Params "toc" }}
  {{ $showToc = .Site.Params.toc }}
{{ end }}
{{ if isset .Params "toc" }}
  {{ $showToc = .Params.toc }}
{{ end }}

{{ if $showToc }}
  <details
    class="bg-operandi-white-dim dark:bg-vivendi-black-dim rounded-lg p-4"
  >
    <summary class="ml-1">
      <span> Table of Contents </span>
    </summary>
    {{ .TableOfContents }}
  </details>
{{ end }}
